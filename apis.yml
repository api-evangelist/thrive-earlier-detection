name: Thrive Earlier Detection
description: 'Thrive Earlier Detection Corp. was a healthcare/biotech company commercializing
  CancerSEEK, a machine-learning-driven liquid biopsy blood test to detect multiple cancer
  types from a single blood draw. Spun out of Johns Hopkins technology and backed by Lux
  Capital, Bain Capital Life Sciences, Casdin, Google Ventures and others, it raised
  large early rounds before being acquired by Exact Sciences in 2020/2021 for roughly
  $2.15 billion and folded into Exact Sciences. This profile was surfaced as a Lux Capital
  portfolio company and added to the API Evangelist network as an enrichment lead. It is
  a clinical-diagnostics company with no public developer API surface; its former web
  presence (thrivedetect.com) is decommissioned.'
